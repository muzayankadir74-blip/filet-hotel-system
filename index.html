<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c46">
  <title>Yooyyaa Hotel System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #102c46, #1b4965);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      color: #17324d;
      padding: 28px 22px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 35px #0003;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      margin: 8px 0;
      font-size: 27px;
      color: #123b63;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #64748b;
      font-size: 14px;
    }

    .menu {
      display: grid;
      gap: 13px;
    }

    .menu a {
      display: block;
      padding: 16px;
      background: #123b63;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .menu a:active {
      background: #d3a64b;
      color: #102c46;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="https://raw.githubusercontent.com/muzayankadir74-blip/filet-hotel-system/main/2_20261020_211800_0001.png"
      alt="Yooyyaa Hotel Logo"
    >

    <h1>Yooyyaa Hotel System</h1>
    <p class="subtitle">Hotel Management System</p>

    <nav class="menu">
      <a href="dashboard.html">🏨 Dashboard / Bulchiinsa</a>
      <a href="guest-registration.html">👤 Guest Registration / Keessummaa</a>
      <a href="room-management.html">🛏️ Room Management / Kutaalee</a>
      <a href="bookings.html">📅 Bookings / Qabsiisa</a>
      <a href="payments.html">💳 Payments / Kaffaltii</a>
    </nav>

    <p class="footer">© Yooyyaa Hotel System</p>

  </main>
</body>
</html>
