
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b4e">
  <meta name="description" content="FILET HOTEL Management System">
  <title>FILET HOTEL SYSTEM</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #102b4e;
    }

    header {
      background: #102b4e;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    .hotel-logo {
      display: block;
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin: 0 auto 12px;
      background: white;
      border-radius: 14px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .menu a {
      display: block;
      background: white;
      color: #102b4e;
      text-decoration: none;
      text-align: center;
      padding: 22px 8px;
      border-radius: 12px;
      box-shadow: 0 2px 7px #00000012;
      font-weight: bold;
      min-height: 95px;
    }

    .menu a:active {
      background: #dbeafe;
    }

    .icon {
      display: block;
      font-size: 27px;
      margin-bottom: 9px;
    }

    .welcome {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-top: 16px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <img
      class="hotel-logo"
      src="./2_20261020_211800_0001.png"
      alt="FILET HOTEL SYSTEM Logo"
    >

    <h1>FILET HOTEL</h1>
    <p>Hotel Management System</p>
  </header>

  <main>
    <div class="menu">
      <a href="./dashboard.html">
        <span class="icon">📊</span>
        Dashboard
      </a>

      <a href="./guest-registration.html">
        <span class="icon">👤</span>
        Guest Registration
      </a>

      <a href="./bookings.html">
        <span class="icon">📅</span>
        Bookings
      </a>

      <a href="./payments.html">
        <span class="icon">💳</span>
        Payments
      </a>

      <a href="./room-management.html">
        <span class="icon">🛏️</span>
        Room Management
      </a>

      <a href="./hotel-profile.html">
        <span class="icon">🏨</span>
        Hotel Profile
      </a>
    </div>

    <div class="welcome">
      <h3>Welcome to FILET HOTEL</h3>
      <p>Manage your hotel operations in one place.</p>
    </div>
  </main>

  <footer>
    FILET HOTEL SYSTEM
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .then(function () {
            console.log("Service worker registered.");
          })
          .catch(function (error) {
            console.log(
              "Service worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
