<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b4e">
  <title>Yooyyaa Hotel System - Room Management</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #102b4e;
    }

    header {
      background: #102b4e;
      color: white;
      text-align: center;
      padding: 20px 12px;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .panel {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 7px #00000012;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #102b4e;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .room {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #dbe3ed;
      border-radius: 8px;
    }

    .available { color: #15803d; font-weight: bold; }
    .occupied { color: #b91c1c; font-weight: bold; }
    .maintenance { color: #b45309; font-weight: bold; }

    .back {
      display: inline-block;
      color: white;
      margin-top: 10px;
    }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>🏨 Yooyyaa Hotel System</h1>
    <p>Room Management - Bulchiinsa Kutaa</p>
    <a class="back" href="./index.html">← Gara Fuula Jalqabaatti</a>
  </header>

  <main>
    <section class="panel">
      <h2>➕ Kutaa Haaraa Galmeessi</h2>

      <form id="roomForm">
        <label for="roomNumber">Lakkoofsa Kutaa</label>
        <input id="roomNumber" type="text"
          placeholder="Fakkeenya: 104" required>

        <label for="roomType">Gosa Kutaa</label>
        <select id="roomType" required>
          <option value="">Gosa filadhu</option>
          <option value="Single">Single</option>
          <option value="Double">Double</option>
          <option value="Twin">Twin</option>
          <option value="Suite">Suite</option>
          <option value="Standard">Standard</option>
          <option value="Deluxe">Deluxe</option>
        </select>

        <label for="roomPrice">Gatii Halkan Tokko (ETB)</label>
        <input id="roomPrice" type="number" min="0"
          step="0.01" placeholder="Fakkeenya: 1500" required>

        <label for="roomStatus">Haala Kutaa</label>
        <select id="roomStatus" required>
          <option value="available">Bilisa</option>
          <option value="occupied">Keessummaan keessa jira</option>
          <option value="maintenance">Suphaa barbaada</option>
        </select>

        <button id="saveButton" type="submit">Kutaa Galmeessi</button>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>🛏️ Kutaalee Hoteelaa</h2>
      <p id="roomCount">Kutaalee fe'aa jira...</p>
      <button id="refreshButton" type="button">
        Kutaalee Haaromsi
      </button>
      <div id="roomList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://wyesygvwhlmrefqcridg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

    const HOTEL_ID = "0be7a002-21fb-4af0-8ac7-7771ba63f609";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("roomForm");
    const roomList = document.getElementById("roomList");
    const roomCount = document.getElementById("roomCount");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#15803d";
    }

    function statusLabel(status) {
      const labels = {
        available: "Bilisa",
        occupied: "Keessummaan keessa jira",
        maintenance: "Suphaa barbaada"
      };

      return labels[status] || status;
    }

    function statusClass(status) {
      if (status === "available") return "available";
      if (status === "occupied") return "occupied";
      return "maintenance";
    }

    async function loadRooms() {
      roomList.replaceChildren();
      roomCount.textContent = "Kutaalee fe'aa jira...";

      const { data, error } = await db
        .from("rooms")
        .select("id, room_number, room_type, status, price_per_night")
        .eq("hotel_id", HOTEL_ID)
        .order("room_number");

      if (error) {
        roomCount.textContent = "Kutaalee argachuun hin danda'amne.";
        showMessage(
          "Dogoggora: " + error.message +
          ". Internet fi Supabase RLS ilaali.",
          true
        );
        return;
      }

      roomCount.textContent = "Kutaan galmaa'e: " + data.length;

      if (data.length === 0) {
        roomList.textContent = "Ammaaf kutaan hin galmoofne.";
        return;
      }

      data.forEach((room) => {
        const card = document.createElement("div");
        card.className = "room";

        const heading = document.createElement("h3");
        heading.textContent = "Kutaa " + room.room_number;

        const details = document.createElement("p");
        details.textContent =
          "Gosa: " + (room.room_type || "Hin ibsamne") +
          " | Gatii: " + Number(room.price_per_night).toLocaleString() +
          " ETB/halkan";

        const status = document.createElement("p");
        status.textContent = "Haala: " + statusLabel(room.status);
        status.className = statusClass(room.status);

        const label = document.createElement("label");
        label.textContent = "Haala jijjiiri";

        const select = document.createElement("select");

        [
          ["available", "Bilisa"],
          ["occupied", "Keessummaan keessa jira"],
          ["maintenance", "Suphaa barbaada"]
        ].forEach(([value, text]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = text;
          select.appendChild(option);
        });

        select.value = room.status;

        select.addEventListener("change", async () => {
          select.disabled = true;
          showMessage("Haala kutaa jijjiiraa jira...");

          const { error } = await db
            .from("rooms")
            .update({ status: select.value })
            .eq("id", room.id)
            .eq("hotel_id", HOTEL_ID);

          if (error) {
            showMessage("Jijjiiruun hin milkoofne: " + error.message, true);
            select.value = room.status;
          } else {
            showMessage("Haalli kutaa sirriitti jijjiirameera.");
            await loadRooms();
          }

          select.disabled = false;
        });

        card.append(heading, details, status, label, select);
        roomList.appendChild(card);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const number =
        document.getElementById("roomNumber").value.trim();
      const type = document.getElementById("roomType").value;
      const price =
        Number(document.getElementById("roomPrice").value);
      const status = document.getElementById("roomStatus").value;

      if (!number || !type || !Number.isFinite(price) || price < 0) {
        showMessage("Odeeffannoo sirrii guuti.", true);
        return;
      }

      saveButton.disabled = true;
      showMessage("Kutaa galmeessaa jira...");

      const { error } = await db
        .from("rooms")
        .insert([{
          hotel_id: HOTEL_ID,
          room_number: number,
          room_type: type,
          price_per_night: price,
          status: status
        }]);

      saveButton.disabled = false;

      if (error) {
        if (error.code === "23505") {
          showMessage("Lakkoofsi kutaa kun duraan galmaa'eera.", true);
        } else {
          showMessage(
            "Galmeessuun hin milkoofne: " + error.message,
            true
          );
        }
        return;
      }

      form.reset();
      showMessage("Kutaan haaraan Supabase keessatti galmaa'eera.");
      await loadRooms();
    });

    document.getElementById("refreshButton")
      .addEventListener("click", loadRooms);

    if (window.supabase) {
      loadRooms();
    } else {
      showMessage(
        "Supabase hin fe'amne. Internet ilaaliitii fuula haaromsi.",
        true
      );
    }
  </script>
</body>
</html>
