
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c46">
  <title>Yooyyaa Hotel System - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102c46, #1b4965);
      color: #172b3a;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 12px 35px #0003;
    }
    h1 { color: #102c46; text-align: center; margin: 0 0 8px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 24px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      background: #102c46;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #e8eef4; color: #102c46; }
    .link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #175b86;
      cursor: pointer;
      text-decoration: underline;
    }
    .message { margin-top: 16px; text-align: center; line-height: 1.5; overflow-wrap: anywhere; }
    .hidden { display: none; }
    .note { color: #64748b; font-size: 13px; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Yooyyaa Hotel</h1>
    <p class="subtitle">Hotel System Login</p>

    <section id="loginSection">
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required
               placeholder="Email kee galchi">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               required placeholder="Password kee galchi">

        <button id="loginButton" type="submit">Login</button>
      </form>
      <span class="link" id="forgotLink">Password dagatteettaa?</span>
    </section>

    <section id="resetSection" class="hidden">
      <h3>Password Haaraa Argachuuf</h3>
      <p>Email account kee galchi; link deebisanii haaromsuu siif ergina.</p>
      <form id="resetForm">
        <label for="resetEmail">Email</label>
        <input id="resetEmail" type="email" required placeholder="Email kee">
        <button id="resetButton" type="submit">Reset Link Ergi</button>
      </form>
      <span class="link" id="backLink">Gara Login Deebi'i</span>
    </section>

    <section id="newPasswordSection" class="hidden">
      <h3>Password Haaraa Uumi</h3>
      <form id="newPasswordForm">
        <label for="newPassword">Password haaraa</label>
        <input id="newPassword" type="password" minlength="8"
               autocomplete="new-password" required
               placeholder="Yoo xiqqaate qubee 8">

        <label for="confirmPassword">Password irra deebi'i</label>
        <input id="confirmPassword" type="password" minlength="8"
               autocomplete="new-password" required
               placeholder="Password mirkaneessi">

        <button id="savePasswordButton" type="submit">Password Olkaa'i</button>
      </form>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="note">Yooyyaa Hotel System</p>
  </main>

  <script>
    const SUPABASE_URL = "https://wyesygvwhlmrefqcridg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

    const DASHBOARD_URL =
      "https://muzayankadir74-blip.github.io/filet-hotel-system/dashboard.html";

    const REDIRECT_URL =
      "https://muzayankadir74-blip.github.io/filet-hotel-system/hotel-login.html";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = id => document.getElementById(id);

    function showMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").style.color = isError ? "#b91c1c" : "#166534";
    }

    function showSection(sectionId) {
      ["loginSection", "resetSection", "newPasswordSection"].forEach(id => {
        $(id).classList.toggle("hidden", id !== sectionId);
      });
      showMessage("");
    }

    $("forgotLink").addEventListener("click", () => {
      $("resetEmail").value = $("email").value.trim();
      showSection("resetSection");
    });

    $("backLink").addEventListener("click", () => {
      showSection("loginSection");
    });

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = $("loginButton");
      button.disabled = true;
      button.textContent = "Login...";

      try {
        const email = $("email").value.trim();
        const password = $("password").value;

        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        if (!data.session) throw new Error("Session hin uumamne.");

        showMessage("Login milkaa'eera. Gara dashboard deemaa...");
        window.location.replace(DASHBOARD_URL);
      } catch (error) {
        showMessage("Login hin milkoofne: " + error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    $("resetForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = $("resetButton");
      button.disabled = true;
      button.textContent = "Ergaa jira...";

      try {
        const email = $("resetEmail").value.trim();
        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: REDIRECT_URL
        });

        if (error) throw error;

        showMessage(
          "Yoo email kun account Supabase keessatti jiraate, link password haaromsuu siif ergama. Inbox fi Spam ilaali."
        );
      } catch (error) {
        showMessage("Link erguun hin milkoofne: " + error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = "Reset Link Ergi";
      }
    });

    async function checkRecoveryLink() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace(/^#/, ""));
      const query = new URLSearchParams(window.location.search);
      const recovery = params.get("type") === "recovery" ||
                       query.get("type") === "recovery";

      if (recovery) {
        showSection("newPasswordSection");
        return;
      }

      const { data, error } = await client.auth.getSession();

      if (error) {
        showMessage("Session ilaaluun hin milkoofne: " + error.message, true);
        return;
      }

      if (data.session) {
        window.location.replace(DASHBOARD_URL);
      }
    }

    $("newPasswordForm").addEventListener("submit", async event => {
      event.preventDefault();

      const password = $("newPassword").value;
      const confirmation = $("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Password yoo xiqqaate qubee 8 qabaachuu qaba.", true);
        return;
      }

      if (password !== confirmation) {
        showMessage("Password lamaan wal hin fakkaatan.", true);
        return;
      }

      const button = $("savePasswordButton");
      button.disabled = true;
      button.textContent = "Olkaa'aa jira...";

      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;

        showMessage(
          "Password haarawaan olkaa'ameera. Amma password haaraan login godhi."
        );

        await client.auth.signOut();
        window.history.replaceState({}, document.title, window.location.pathname);
        $("newPasswordForm").reset();
        showSection("loginSection");
      } catch (error) {
        showMessage(
          "Password jijjiiruun hin milkoofne. Link recovery haaraa gaafadhu yoo link kun yeroo isaa darbe. Ibsa: " +
          error.message,
          true
        );
      } finally {
        button.disabled = false;
        button.textContent = "Password Olkaa'i";
      }
    });

    checkRecoveryLink();
  </script>
</body>
</html>
