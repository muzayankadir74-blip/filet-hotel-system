<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12345a">
<title>Yooyyaa Hotel System - Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;font-family:Arial,sans-serif;
  background:#eef2f7;color:#12345a
}
.login-box{
  background:white;width:100%;max-width:400px;padding:26px;
  border-radius:16px;box-shadow:0 5px 24px #0002
}
h1{text-align:center;font-size:24px}
.subtitle{text-align:center;color:#64748b}
label{display:block;margin-top:18px;font-weight:bold}
input{
  width:100%;padding:13px;margin-top:7px;
  border:1px solid #cbd5e1;border-radius:8px;font-size:16px
}
button{
  width:100%;padding:13px;margin-top:16px;background:#087f5b;
  color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold
}
button:disabled{opacity:.6}
#message{margin-top:16px;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.back{text-align:center;margin-top:20px}
a{color:#087f5b}
.notice{font-size:13px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="login-box">
  <h1>🏨 Yooyyaa Hotel System</h1>
  <p class="subtitle">Owner &amp; Staff Login</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email"
      autocomplete="username" required
      placeholder="Enter your registered email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
      autocomplete="current-password" required
      placeholder="Enter your password">

    <button id="loginButton" type="submit">Login</button>
  </form>

  <button id="resetButton" type="button"
    style="background:#12345a">
    Forgot Password?
  </button>

  <p id="message" role="status" aria-live="polite"></p>

  <p class="notice">
    Sign in with the email and password registered in Supabase.
    Do not share your password with anyone.
  </p>

  <div class="back">
    <a href="index.html">Back to Home</a>
    <br><br>
    <a href="dashboard.html">Dashboard</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://wyesygvwhlmrefqcridg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
const resetButton = document.getElementById("resetButton");
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");

let client = null;

if (!window.supabase) {
  message.textContent =
    "Supabase library hin banamne. Internet ilaaliitii fuula haaromsi.";
  loginButton.disabled = true;
  resetButton.disabled = true;
} else {
  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    message.textContent = "";
    loginButton.disabled = true;
    resetButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: document.getElementById("password").value
      });

      if (error) throw error;

      if (data.session) {
        message.textContent = "Login milkaa'e. Dashboard banamaa jira...";
        window.location.href = "dashboard.html";
        return;
      }

      message.textContent =
        "Session hin argamne. Email mirkaneessuu kee ilaali.";
    } catch (error) {
      console.error("Supabase login error:", error);
      message.textContent = "Login hin milkoofne: " +
        (error.message || "Dogoggora hin beekamne.");
    } finally {
      loginButton.disabled = false;
      resetButton.disabled = false;
      loginButton.textContent = "Login";
    }
  });

  resetButton.addEventListener("click", async function() {
    const email = emailInput.value.trim();

    if (!email) {
      message.textContent =
        "Jalqaba kutaa Email keessatti email kee galchi.";
      emailInput.focus();
      return;
    }

    resetButton.disabled = true;
    loginButton.disabled = true;
    resetButton.textContent = "Sending...";

    try {
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo:
          "https://muzayankadir74-blip.github.io/filet-hotel-system/hotel-login.html"
      });

      if (error) throw error;

      message.textContent =
        "Yoo email kun account Supabase keessatti jiraate, email password reset ergameera. Inbox fi Spam ilaali.";
    } catch (error) {
      console.error("Password reset error:", error);
      message.textContent =
        "Password reset hin milkoofne: " +
        (error.message || "Dogoggora hin beekamne.");
    } finally {
      resetButton.disabled = false;
      loginButton.disabled = false;
      resetButton.textContent = "Forgot Password?";
    }
  });
}
</script>
</body>
</html>
