
<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12345a">
  <title>Yooyyaa Hotel System - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #12345a, #2563eb);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px #0003;
    }
    h1 { text-align: center; color: #12345a; }
    .subtitle { text-align: center; color: #64748b; }
    label { display: block; font-weight: bold; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: #12345a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    .link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #1d4ed8;
      text-decoration: underline;
      cursor: pointer;
    }
    #message { margin-top: 16px; overflow-wrap: anywhere; line-height: 1.5; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🏨 Yooyyaa Hotel</h1>
    <p class="subtitle">Hotel System Login</p>

    <section id="loginSection">
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username"
          placeholder="Email kee galchi" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
          placeholder="Password kee galchi" required>

        <button id="loginBtn" type="submit">Login</button>
      </form>
      <span id="forgotLink" class="link">Password dagatteettaa?</span>
    </section>

    <section id="resetSection" class="hidden">
      <h3>Password haaromsuu</h3>
      <form id="resetForm">
        <label for="resetEmail">Email</label>
        <input id="resetEmail" type="email" required placeholder="Email kee">
        <button id="resetBtn" type="submit">Reset Link Ergi</button>
      </form>
      <span id="backLink" class="link">Gara Login deebi'i</span>
    </section>

    <section id="newPasswordSection" class="hidden">
      <h3>Password haaraa uumi</h3>
      <form id="newPasswordForm">
        <label for="newPassword">Password haaraa</label>
        <input id="newPassword" type="password" minlength="8"
          autocomplete="new-password" required placeholder="Qubee 8 ykn isaa ol">

        <label for="confirmPassword">Password irra deebi'i</label>
        <input id="confirmPassword" type="password" minlength="8"
          autocomplete="new-password" required placeholder="Mirkaneessi">

        <button id="saveBtn" type="submit">Password Olkaa'i</button>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <p style="text-align:center;color:#64748b;font-size:13px">
      Yooyyaa Hotel System © 2026
    </p>
  </main>

<script>
(() => {
  const SUPABASE_URL = "https://wyesygvwhlmrefqcridg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";
  const LOGIN_URL = "https://muzayankadir74-blip.github.io/filet-hotel-system/hotel-login.html";
  const DASHBOARD_URL = "https://muzayankadir74-blip.github.io/filet-hotel-system/dashboard.html";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const el = id => document.getElementById(id);

  function message(text, error = false) {
    el("message").textContent = text;
    el("message").style.color = error ? "#b91c1c" : "#166534";
  }

  function show(section) {
    ["loginSection", "resetSection", "newPasswordSection"].forEach(id => {
      el(id).classList.toggle("hidden", id !== section);
    });
    message("");
  }

  el("forgotLink").onclick = () => {
    el("resetEmail").value = el("email").value.trim();
    show("resetSection");
  };
  el("backLink").onclick = () => show("loginSection");

  el("loginForm").onsubmit = async event => {
    event.preventDefault();
    const btn = el("loginBtn");
    btn.disabled = true;
    btn.textContent = "Login...";

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email: el("email").value.trim(),
        password: el("password").value
      });
      if (error) throw error;
      if (!data.session) throw new Error("Session hin uumamne.");
      window.location.href = DASHBOARD_URL;
    } catch (error) {
      message("Login hin milkoofne: " + error.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Login";
    }
  };

  el("resetForm").onsubmit = async event => {
    event.preventDefault();
    try {
      const { error } = await client.auth.resetPasswordForEmail(
        el("resetEmail").value.trim(),
        { redirectTo: LOGIN_URL }
      );
      if (error) throw error;
      message("Yoo email kun account keessa jiraate, link haaromsuu siif ergama. Inbox fi Spam ilaali.");
    } catch (error) {
      message("Link erguun hin milkoofne: " + error.message, true);
    }
  };

  async function checkPage() {
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);

    if (hash.get("error") || query.get("error")) {
      message(hash.get("error_description") || query.get("error_description") ||
        "Link recovery sirrii miti. Link haaraa gaafadhu.", true);
      return;
    }

    const code = query.get("code");
    if (code) {
      const { error } = await client.auth.exchangeCodeForSession(code);
      if (error) {
        message("Link recovery hin hojjenne: " + error.message, true);
        return;
      }
      history.replaceState({}, document.title, location.pathname);
      show("newPasswordSection");
      return;
    }

    if ((hash.get("type") || query.get("type")) === "recovery") {
      const access = hash.get("access_token");
      const refresh = hash.get("refresh_token");
      if (access && refresh) {
        const { error } = await client.auth.setSession({
          access_token: access,
          refresh_token: refresh
        });
        if (error) {
          message("Session recovery hin milkoofne: " + error.message, true);
          return;
        }
      }
      show("newPasswordSection");
      return;
    }

    const { data, error } = await client.auth.getSession();
    if (!error && data.session) {
      window.location.href = DASHBOARD_URL;
    }
  }

  el("newPasswordForm").onsubmit = async event => {
    event.preventDefault();
    const password = el("newPassword").value;
    if (password.length < 8) {
      message("Password yoo xiqqaate qubee 8 qabaachuu qaba.", true);
      return;
    }
    if (password !== el("confirmPassword").value) {
      message("Password lamaan wal hin fakkaatan.", true);
      return;
    }

    const btn = el("saveBtn");
    btn.disabled = true;
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      await client.auth.signOut();
      history.replaceState({}, document.title, location.pathname);
      el("newPasswordForm").reset();
      show("loginSection");
      message("Password haaraan olkaa'ameera. Amma login godhi.");
    } catch (error) {
      message("Password jijjiiruun hin milkoofne: " + error.message, true);
    } finally {
      btn.disabled = false;
    }
  };

  checkPage();
})();
</script>
</body>
</html>
