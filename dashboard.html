
<script>
(() => {
  const SUPABASE_URL =
    "https://wyesygvwhlmrefqcridg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

  const HOTEL_ID =
    "0be7a002-21fb-4af0-8ac7-7771ba63f609";

  const LOGIN_PAGE = "./hotel-login.html";

  const loading = document.getElementById("loading");
  const app = document.getElementById("app");
  const statusBox = document.getElementById("status");
  const logoutBtn = document.getElementById("logoutBtn");

  function showStatus(message) {
    statusBox.textContent = message;
    statusBox.hidden = false;
  }

  async function updateDashboard(client) {
    statusBox.hidden = true;

    const guestElement =
      document.getElementById("registeredGuests");

    const roomElement =
      document.getElementById("totalRooms");

    const availableElement =
      document.getElementById("availableRooms");

    const occupiedElement =
      document.getElementById("occupiedRooms");

    const bookingElement =
      document.getElementById("totalBookings");

    const paymentElement =
      document.getElementById("totalPayments");

    try {
      // ROOMS: Supabase irraa
      const { data: rooms, error: roomError } = await client
        .from("rooms")
        .select("room_number,status")
        .eq("hotel_id", HOTEL_ID);

      if (roomError) throw new Error("Rooms: " + roomError.message);

      const roomList = rooms || [];

      const available = roomList.filter(room => {
        const s = String(room.status || "").toLowerCase();
        return ["available", "free", "bilisa"].some(x =>
          s.includes(x)
        );
      }).length;

      const occupied = roomList.filter(room => {
        const s = String(room.status || "").toLowerCase();
        return ["occupied", "booked", "reserved", "qabame"].some(x =>
          s.includes(x)
        );
      }).length;

      roomElement.textContent = roomList.length;
      availableElement.textContent = available;
      occupiedElement.textContent = occupied;

      // GUESTS: Supabase irraa
      const { count: guestCount, error: guestError } =
        await client
          .from("guests")
          .select("id", { count: "exact", head: true })
          .eq("hotel_id", HOTEL_ID);

      if (guestError) throw new Error("Guests: " + guestError.message);

      guestElement.textContent = guestCount ?? 0;

      // BOOKINGS: Supabase irraa
      const { count: bookingCount, error: bookingError } =
        await client
          .from("bookings")
          .select("id", { count: "exact", head: true })
          .eq("hotel_id", HOTEL_ID);

      if (bookingError) {
        throw new Error("Bookings: " + bookingError.message);
      }

      bookingElement.textContent = bookingCount ?? 0;

      // PAYMENTS: Supabase irraa
      const { data: payments, error: paymentError } =
        await client
          .from("payments")
          .select("amount")
          .eq("hotel_id", HOTEL_ID);

      if (paymentError) {
        throw new Error("Payments: " + paymentError.message);
      }

      const paymentTotal = (payments || []).reduce((sum, payment) => {
        const amount = Number(payment.amount || 0);
        return sum + (Number.isFinite(amount) ? amount : 0);
      }, 0);

      paymentElement.textContent =
        paymentTotal.toLocaleString("en-US", {
          maximumFractionDigits: 2
        }) + " ETB";

    } catch (error) {
      showStatus(
        "Odeeffannoo Supabase dubbisuu irratti rakkoon uumame: " +
        error.message
      );
      console.error("Dashboard data error:", error);
    }
  }

  async function start() {
    if (!window.supabase) {
      loading.textContent =
        "Supabase hin banne. Internet kee ilaali.";
      return;
    }

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    try {
      const { data, error } = await client.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        window.location.replace(LOGIN_PAGE);
        return;
      }

      const { data: userData, error: userError } =
        await client.auth.getUser();

      if (userError || !userData.user) {
        await client.auth.signOut();
        window.location.replace(LOGIN_PAGE);
        return;
      }

      document.getElementById("userEmail").textContent =
        "Signed in: " + (userData.user.email || "Hotel account");

      loading.hidden = true;
      app.hidden = false;

      await updateDashboard(client);

      logoutBtn.addEventListener("click", async () => {
        logoutBtn.disabled = true;
        logoutBtn.textContent = "Logging out...";

        const { error: signOutError } =
          await client.auth.signOut();

        if (signOutError) {
          showStatus("Logout hin milkoofne: " + signOutError.message);
          logoutBtn.disabled = false;
          logoutBtn.textContent = "🚪 Logout";
          return;
        }

        window.location.replace(LOGIN_PAGE);
      });

      client.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT" || !session) {
          window.location.replace(LOGIN_PAGE);
        }
      });

      window.addEventListener("pageshow", () => {
        updateDashboard(client);
      });

    } catch (error) {
      loading.textContent =
        "Login mirkaneessuu hin dandeenye. Internet ilaaliitii irra deebi'i.";

      console.error("Dashboard auth error:", error);
    }
  }

  start();
})();
</script>
