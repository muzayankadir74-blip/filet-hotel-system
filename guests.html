
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILET HOTEL - Guest Registration</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 16px;
  background: #f1f5f9;
  color: #172554;
}
header {
  background: #102b4e;
  color: white;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
}
.card {
  background: white;
  padding: 16px;
  margin: 14px 0;
  border-radius: 12px;
}
label {
  display: block;
  margin-top: 12px;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}
button {
  width: 100%;
  background: #102b4e;
  color: white;
  border: none;
  padding: 14px;
  margin-top: 18px;
  border-radius: 8px;
  font-size: 16px;
}
.guest {
  border-left: 5px solid #16a34a;
}
</style>
</head>
<body>

<header>
  <h2>FILET HOTEL</h2>
  <p>Guest Registration</p>
</header>

<div class="card">
  <h3>Register New Guest</h3>

  <label>Guest Full Name</label>
  <input id="name" placeholder="Enter guest name">

  <label>Phone Number</label>
  <input id="phone" type="tel" placeholder="Phone number">

  <label>Room Number</label>
  <input id="room" placeholder="Example: 101">

  <label>Check-in Date</label>
  <input id="checkin" type="date">

  <label>Check-out Date</label>
  <input id="checkout" type="date">

  <button onclick="registerGuest()">Register Guest</button>
</div>

<h3>Registered Guests</h3>
<div id="guestList"></div>

<script>
let guests = JSON.parse(
  localStorage.getItem("filetGuests") || "[]"
);

function registerGuest() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const room = document.getElementById("room").value.trim();
  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;

  if (!name || !phone || !room || !checkin || !checkout) {
    alert("Please complete all fields.");
    return;
  }

  if (checkout <= checkin) {
    alert("Check-out must be after check-in.");
    return;
  }

  guests.push({name, phone, room, checkin, checkout});

  localStorage.setItem("filetGuests", JSON.stringify(guests));

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("room").value = "";
  document.getElementById("checkin").value = "";
  document.getElementById("checkout").value = "";

  showGuests();
  alert("Guest registered successfully!");
}

function showGuests() {
  const list = document.getElementById("guestList");
  list.innerHTML = "";

  if (guests.length === 0) {
    list.innerHTML = "<p>No guests registered yet.</p>";
    return;
  }

  guests.forEach((guest) => {
    const card = document.createElement("div");
    card.className = "card guest";

    const details = document.createElement("p");
    details.textContent =
      "Name: " + guest.name +
      " | Phone: " + guest.phone +
      " | Room: " + guest.room +
      " | Check-in: " + guest.checkin +
      " | Check-out: " + guest.checkout;

    card.appendChild(details);
    list.appendChild(card);
  });
}

showGuests();
</script>

</body>
</html>
