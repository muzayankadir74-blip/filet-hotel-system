
<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yooyyaa Hotel System - Restaurant Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #17324d;
    }

    header {
      background: #102b4e;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; font-size: 23px; }
    header p { margin: 0; font-size: 14px; }

    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 14px 30px;
    }

    .panel {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000d;
    }

    h2 { margin-top: 0; font-size: 19px; }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }

    button, .back {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 14px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back { background: #102b4e; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
    }

    th, td {
      padding: 11px 8px;
      border-bottom: 1px solid #e5eaf0;
      text-align: left;
    }

    th { background: #edf2f7; }

    .note {
      color: #5d6b7a;
      font-size: 14px;
      line-height: 1.5;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .delete-btn {
      background: #b42318;
      margin: 0;
      padding: 7px 10px;
    }

    .refresh-btn {
      background: #102b4e;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Yooyyaa Hotel System</h1>
    <p>Restaurant Management — Bulchiinsa Mana Nyaataa</p>
  </header>

  <main>
    <p><a class="back" href="dashboard.html">← Gara Dashboard</a></p>

    <section class="panel">
      <h2>➕ Nyaata Galmeessi</h2>
      <p class="note">
        Nyaata mana nyaataa, gatii fi baay'ina isaa galmeessi.
        Odeeffannoon Supabase database keessatti kuufama.
      </p>

      <form id="foodForm">
        <label for="foodName">Maqaa nyaataa</label>
        <input id="foodName" required placeholder="Fakkeenya: Injera firfir">

        <label for="foodCategory">Gosa</label>
        <select id="foodCategory" required>
          <option value="">Gosa filadhu</option>
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Dinner</option>
          <option>Snack</option>
          <option>Other</option>
        </select>

        <label for="foodQuantity">Baay'ina jiru</label>
        <input id="foodQuantity" type="number" min="0" step="1"
          required placeholder="Fakkeenya: 10">

        <label for="foodPrice">Gatii tokkoo (ETB)</label>
        <input id="foodPrice" type="number" min="0" step="0.01"
          required placeholder="Fakkeenya: 250">

        <button id="saveButton" type="submit">Nyaata Galmeessi</button>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>🍽️ Tarree Nyaataa</h2>

      <p id="foodCount">Nyaata galmaa'e: 0</p>

      <button class="refresh-btn" id="refreshButton" type="button">
        Tarree Haaromsi
      </button>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Maqaa</th>
              <th>Gosa</th>
              <th>Baay'ina</th>
              <th>Gatii (ETB)</th>
              <th>Haqi</th>
            </tr>
          </thead>
          <tbody id="foodList">
            <tr><td colspan="5">Eegaa...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://wyesygvwhlmrefqcridg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

    const HOTEL_ID =
      "0be7a002-21fb-4af0-8ac7-7771ba63f609";

    const LOGIN_PAGE = "./hotel-login.html";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("foodForm");
    const list = document.getElementById("foodList");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const refreshButton = document.getElementById("refreshButton");

    let currentUser = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b42318" : "#087f5b";
    }

    async function checkLogin() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        window.location.replace(LOGIN_PAGE);
        return false;
      }

      const { data: userData, error: userError } =
        await client.auth.getUser();

      if (userError || !userData.user) {
        await client.auth.signOut();
        window.location.replace(LOGIN_PAGE);
        return false;
      }

      currentUser = userData.user;

      if (currentUser.id !==
        "5541bd2d-27fa-4a83-9f3e-60215daecf20") {
        showMessage("User mirga qabu miti.", true);
        return false;
      }

      return true;
    }

    async function loadFoods() {
      list.innerHTML =
        '<tr><td colspan="5">Eegaa...</td></tr>';

      const { data, error } = await client
        .from("restaurant_items")
        .select("id, name, category, quantity, price")
        .eq("hotel_id", HOTEL_ID)
        .order("created_at", { ascending: false });

      if (error) {
        showMessage("Nyaata fe'uun hin danda'amne: " +
          error.message, true);
        list.innerHTML =
          '<tr><td colspan="5">Dogoggorri uumame.</td></tr>';
        return;
      }

      renderFoods(data || []);
    }

    function renderFoods(foods) {
      list.replaceChildren();

      document.getElementById("foodCount").textContent =
        "Nyaata galmaa'e: " + foods.length;

      if (foods.length === 0) {
        const row = list.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.textContent = "Nyaanni hin galmoofne.";
        return;
      }

      foods.forEach(food => {
        const row = list.insertRow();

        [
          food.name,
          food.category,
          food.quantity,
          Number(food.price).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          })
        ].forEach(value => {
          row.insertCell().textContent = value ?? "";
        });

        const actionCell = row.insertCell();
        const deleteButton = document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Haqi";

        deleteButton.addEventListener("click", async () => {
          const confirmed = confirm(
            "Nyaata kana haquu barbaaddaa?"
          );

          if (!confirmed) return;

          deleteButton.disabled = true;

          const { error } = await client
            .from("restaurant_items")
            .delete()
            .eq("id", food.id)
            .eq("hotel_id", HOTEL_ID);

          if (error) {
            showMessage("Haqiinsi hin milkoofne: " +
              error.message, true);
            deleteButton.disabled = false;
            return;
          }

          showMessage("Nyaanni milkaa'inaan haqame.");
          await loadFoods();
        });

        actionCell.appendChild(deleteButton);
      });
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!currentUser) {
        showMessage("Maaloo jalqaba login godhi.", true);
        return;
      }

      const food = {
        hotel_id: HOTEL_ID,
        name: document.getElementById("foodName").value.trim(),
        category: document.getElementById("foodCategory").value,
        quantity: Number(
          document.getElementById("foodQuantity").value
        ),
        price: Number(
          document.getElementById("foodPrice").value
        ),
        is_available: true
      };

      if (
        !food.name ||
        !food.category ||
        !Number.isFinite(food.quantity) ||
        food.quantity < 0 ||
        !Number.isFinite(food.price) ||
        food.price < 0
      ) {
        showMessage("Maaloo odeeffannoo sirrii guuti.", true);
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Kuusaa jira...";

      const { error } = await client
        .from("restaurant_items")
        .insert(food);

      saveButton.disabled = false;
      saveButton.textContent = "Nyaata Galmeessi";

      if (error) {
        showMessage("Nyaata kuusuun hin danda'amne: " +
          error.message, true);
        return;
      }

      form.reset();
      showMessage("Nyaanni Supabase keessatti milkaa'inaan galmaa'e.");
      await loadFoods();
    });

    refreshButton.addEventListener("click", loadFoods);

    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        window.location.replace(LOGIN_PAGE);
      }
    });

    async function startPage() {
      const loggedIn = await checkLogin();

      if (loggedIn) {
        await loadFoods();
      }
    }

    startPage();
  </script>
</body>
</html>
