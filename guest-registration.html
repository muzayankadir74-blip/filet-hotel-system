
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b4e">
  <title>FILET HOTEL - Guest Registration</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #172033;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 { color: #075985; text-align: center; }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border-radius: 7px;
      font-size: 16px;
    }

    input, select { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #075985;
      color: white;
      font-weight: bold;
      margin-top: 20px;
    }

    button:disabled { opacity: 0.6; }

    #message {
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .note {
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>FILET HOTEL</h1>
    <h2>Guest Registration</h2>
    <p class="note">Galmee keessummootaa</p>

    <form id="guestForm">
      <label for="full_name">Guest Full Name</label>
      <input id="full_name" required maxlength="120">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" maxlength="30">

      <label for="room_number">Room Number / Lakkoofsa Kutaa</label>
      <select id="room_number" required>
        <option value="">Kutaa filadhu</option>
      </select>

      <p class="note">
        Kutaalee Available ta'an qofa filachuu dandeessa.
      </p>

      <label for="checkin_date">Check-in Date</label>
      <input id="checkin_date" type="date" required>

      <label for="checkout_date">Check-out Date</label>
      <input id="checkout_date" type="date" required>

      <button id="saveButton" type="submit">Register Guest</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://wyesygvwhlmrefqcridg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";

    const HOTEL_ID =
      "0be7a002-21fb-4af0-8ac7-7771ba63f609";

    const ROOM_STORAGE_KEY = "filetHotelRooms";

    const form = document.getElementById("guestForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const roomSelect = document.getElementById("room_number");

    function getRooms() {
      try {
        const rooms = JSON.parse(
          localStorage.getItem(ROOM_STORAGE_KEY) || "[]"
        );
        return Array.isArray(rooms) ? rooms : [];
      } catch (error) {
        return [];
      }
    }

    function loadRooms() {
      const rooms = getRooms();
      const previousValue = roomSelect.value;

      roomSelect.replaceChildren();

      const firstOption = document.createElement("option");
      firstOption.value = "";
      firstOption.textContent = "Kutaa filadhu";
      roomSelect.appendChild(firstOption);

      const availableRooms = rooms.filter(function(room) {
        return room.status === "Available";
      });

      availableRooms.forEach(function(room) {
        const option = document.createElement("option");
        option.value = String(room.number);
        option.textContent =
          "Room " + room.number + " — " +
          room.type + " — " + room.price + " ETB";

        roomSelect.appendChild(option);
      });

      if (availableRooms.some(function(room) {
        return String(room.number) === previousValue;
      })) {
        roomSelect.value = previousValue;
      }

      if (availableRooms.length === 0) {
        message.textContent =
          "Kutaa Available hin jiru. Bulchiinsa Kutaa keessatti kutaa bilisa galmeessi.";
      } else {
        message.textContent =
          "Kutaa bilisa ta'e filadhu.";
      }
    }

    function markRoomOccupied(roomNumber) {
      const rooms = getRooms();

      const index = rooms.findIndex(function(room) {
        return String(room.number) === String(roomNumber);
      });

      if (index === -1 || rooms[index].status !== "Available") {
        throw new Error(
          "Kutaa filatame hin argamne ykn Available miti."
        );
      }

      rooms[index].status = "Occupied";

      localStorage.setItem(
        ROOM_STORAGE_KEY,
        JSON.stringify(rooms)
      );
    }

    loadRooms();

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const checkin =
        document.getElementById("checkin_date").value;

      const checkout =
        document.getElementById("checkout_date").value;

      const roomNumber = roomSelect.value;

      if (checkout <= checkin) {
        message.textContent =
          "Check-out date, check-in date booda ta'uu qaba.";
        return;
      }

      if (!roomNumber) {
        message.textContent = "Maaloo kutaa filadhu.";
        return;
      }

      const room = getRooms().find(function(item) {
        return String(item.number) === String(roomNumber);
      });

      if (!room || room.status !== "Available") {
        message.textContent =
          "Kutaan filatame Available miti. Tarree haaromsi.";
        loadRooms();
        return;
      }

      if (!window.supabase) {
        message.textContent =
          "Internetii ilaali; Supabase library hin banamne.";
        return;
      }

      const guest = {
        hotel_id: HOTEL_ID,
        full_name:
          document.getElementById("full_name").value.trim(),
        phone:
          document.getElementById("phone").value.trim() || null,
        room_number: String(roomNumber),
        checkin_date: checkin,
        checkout_date: checkout
      };

      if (!guest.full_name) {
        message.textContent =
          "Maqaa keessummaa guuti.";
        return;
      }

      saveButton.disabled = true;
      message.textContent = "Galmeessaa jira...";

      try {
        const db = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { error } = await db
          .from("guests")
          .insert([guest]);

        if (error) throw error;

        try {
          markRoomOccupied(roomNumber);

          message.textContent =
            "Galmeen milkaa'eera! Kutaa " +
            roomNumber + " gara Occupied jijjiirameera.";

          form.reset();
          loadRooms();

        } catch (roomError) {
          message.textContent =
            "Keessummaan Supabase keessatti galmaa'eera, " +
            "garuu haalli kutaa jijjiiramuu hin dandeenye.\n" +
            roomError.message;
        }

      } catch (error) {
        console.error(error);
        message.textContent =
          "Galmeen hin milkoofne. Supabase connection/RLS ilaali.\n" +
          (error.message || "Dogoggora hin beekamne.");
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
