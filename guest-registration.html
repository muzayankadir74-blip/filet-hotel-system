
<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b63">
  <title>Yooyyaa Hotel System - Guest Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #1e293b;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000015;
    }
    .logo {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 10px;
    }
    h2 { text-align: center; color: #123b63; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 22px; }
    label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #123b63;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }
    .success { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #991b1b; }
    .info { display: block; background: #e0f2fe; color: #075985; }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #123b63;
      text-decoration: none;
    }
    .small { font-size: 13px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo"
      src="https://raw.githubusercontent.com/muzayankadir74-blip/filet-hotel-system/main/2_20261020_211800_0001.png"
      alt="Yooyyaa Hotel System Logo">

    <h2>Yooyyaa Hotel System</h2>
    <p class="subtitle">Guest Registration / Galmee Keessummaa</p>

    <form id="guestForm">
      <label for="full_name">Guest Full Name / Maqaa Guutuu</label>
      <input type="text" id="full_name" name="full_name"
        placeholder="Enter guest full name" required>

      <label for="phone">Phone Number / Lakkoofsa Bilbilaa</label>
      <input type="tel" id="phone" name="phone"
        placeholder="Enter phone number" required>

      <label for="room_number">Room Number / Lakkoofsa Kutaa</label>
      <select id="room_number" name="room_number" required>
        <option value="">Kutaalee fe'aa jira...</option>
      </select>
      <button type="button" id="refreshRoomsBtn">Refresh Room List / Kutaalee Haaromsi</button>
      <p class="small" id="roomCount">Kutaalee Supabase irraa fe'aa jira...</p>

      <label for="checkin_date">Check-in Date / Guyyaa Seensaa</label>
      <input type="date" id="checkin_date" name="checkin_date" required>

      <label for="checkout_date">Check-out Date / Guyyaa Ba'umsaa</label>
      <input type="date" id="checkout_date" name="checkout_date" required>

      <button type="submit" id="submitBtn">Register Guest / Galmeessi</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wyesygvwhlmrefqcridg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eVDERe3AMJoBb67sELzr6Q__Ly5Ws7V";
    const HOTEL_ID = "0be7a002-21fb-4af0-8ac7-7771ba63f609";

    const guestForm = document.getElementById("guestForm");
    const roomSelect = document.getElementById("room_number");
    const messageBox = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const refreshRoomsBtn = document.getElementById("refreshRoomsBtn");
    const roomCount = document.getElementById("roomCount");
    const checkinInput = document.getElementById("checkin_date");
    const checkoutInput = document.getElementById("checkout_date");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    if (!window.supabase) {
      roomSelect.innerHTML = "";
      roomSelect.add(new Option("Supabase hin banamne", ""));
      roomCount.textContent = "Supabase library hin fe'amne.";
      showMessage(
        "Supabase hin fe'amne. Internet ilaaliitii fuula haaromsi.",
        "error"
      );
      throw new Error("Supabase JS library did not load.");
    }

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function localToday() {
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
    }

    function setDateDefaults() {
      const today = localToday();
      checkinInput.min = today;
      checkoutInput.min = checkinInput.value || today;

      if (!checkinInput.value) checkinInput.value = today;
      if (checkoutInput.value && checkoutInput.value <= checkinInput.value) {
        checkoutInput.value = "";
      }
    }

    setDateDefaults();

    checkinInput.addEventListener("change", () => {
      checkoutInput.min = checkinInput.value || localToday();

      if (checkoutInput.value && checkoutInput.value <= checkinInput.value) {
        checkoutInput.value = "";
      }
    });

    async function loadAvailableRooms() {
      roomSelect.disabled = true;
      refreshRoomsBtn.disabled = true;
      roomSelect.replaceChildren(new Option("Kutaalee fe'aa jira...", ""));
      roomCount.textContent = "Supabase irraa kutaalee fe'aa jira...";
      clearMessage();

      try {
        const { data, error } = await supabaseClient
          .from("rooms")
          .select("id, room_number, room_type, status, price_per_night")
          .eq("hotel_id", HOTEL_ID)
          .order("room_number");

        if (error) throw error;

        const rooms = Array.isArray(data) ? data : [];

        // Status qubee xixiqqaa/guddaa fi space irratti hundaa'ee qindeessa.
        const availableRooms = rooms.filter(room =>
          room &&
          String(room.status ?? "").trim().toLowerCase() === "available" &&
          String(room.room_number ?? "").trim() !== ""
        );

        roomSelect.replaceChildren(
          new Option("-- Kutaa Bilisaa Filadhu --", "")
        );

        availableRooms.forEach(room => {
          const number = String(room.room_number).trim();
          const option = new Option("", number);

          let label = "Kutaa " + number;

          if (room.room_type) {
            label += " - " + room.room_type;
          }

          if (room.price_per_night !== null &&
              room.price_per_night !== undefined &&
              room.price_per_night !== "") {
            const price = Number(room.price_per_night);
            if (Number.isFinite(price)) {
              label += " - " + price.toLocaleString() + " ETB/halkan";
            }
          }

          option.textContent = label;
          roomSelect.add(option);
        });

        roomCount.textContent =
          "Kutaalee hundaa: " + rooms.length +
          " | Kutaalee bilisaa: " + availableRooms.length;

        // Room numbers Supabase irraa dhufan irratti hundaa'ee hubachiisa.
        if (availableRooms.some(room =>
          String(room.room_number).trim() === "103"
        )) {
          clearMessage();
        } else {
          showMessage(
            "Kutaan 103 tarree Supabase irraa argame keessatti hin jiru ykn status isaa available miti. " +
            "Kutaalee hundaa: " + rooms.length +
            ". Kutaalee bilisaa: " + availableRooms.length +
            ". Room Management fi Supabase rooms table ilaali.",
            "info"
          );
        }

        if (availableRooms.length === 0) {
          showMessage(
            "Kutaa bilisaa hin arganne. Room Management keessatti status kutaa available ta'uu mirkaneessi.",
            "info"
          );
        }
      } catch (error) {
        console.error("Room loading error:", error);

        roomSelect.replaceChildren(
          new Option("Kutaalee argachuun hin danda'amne", "")
        );

        roomCount.textContent = "Kutaalee fe'uun hin milkoofne.";
        showMessage(
          "Kutaalee Supabase irraa argachuun hin milkoofne: " +
          (error.message || "Dogoggora hin beekamne") +
          ". Internet, Supabase fi RLS policy ilaali.",
          "error"
        );
      } finally {
        roomSelect.disabled = false;
        refreshRoomsBtn.disabled = false;
      }
    }

    refreshRoomsBtn.addEventListener("click", loadAvailableRooms);

    guestForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("full_name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const roomNumber = roomSelect.value;
      const checkinDate = checkinInput.value;
      const checkoutDate = checkoutInput.value;

      if (!fullName || !phone) {
        showMessage("Maqaa guutuu fi lakkoofsa bilbilaa guuti.", "error");
        return;
      }

      if (!roomNumber) {
        showMessage("Maaloo kutaa bilisaa filadhu.", "error");
        return;
      }

      if (checkoutDate <= checkinDate) {
        showMessage(
          "Guyyaan ba'umsaa guyyaa seensaa booda ta'uu qaba.",
          "error"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Galmeessaa jira...";

      try {
        const { data: matchingRooms, error: roomError } =
          await supabaseClient
            .from("rooms")
            .select("id, room_number, status")
            .eq("hotel_id", HOTEL_ID)
            .eq("room_number", roomNumber)
            .limit(10);

        if (roomError) throw roomError;

        const room = (matchingRooms || []).find(item =>
          String(item.status ?? "").trim().toLowerCase() === "available"
        );

        if (!room) {
          showMessage(
            "Kutaan filatame amma bilisa miti. Refresh Room List tuqiitii irra deebi'ii filadhu.",
            "error"
          );
          await loadAvailableRooms();
          return;
        }

        const { error: guestError } = await supabaseClient
          .from("guests")
          .insert([{
            hotel_id: HOTEL_ID,
            full_name: fullName,
            phone: phone,
            room_number: roomNumber,
            checkin_date: checkinDate,
            checkout_date: checkoutDate
          }]);

        if (guestError) throw guestError;

        const { error: updateError } = await supabaseClient
          .from("rooms")
          .update({ status: "occupied" })
          .eq("id", room.id)
          .eq("hotel_id", HOTEL_ID);

        if (updateError) {
          console.error("Room status update error:", updateError);
          showMessage(
            "Keessummaan galmaa'eera; garuu status kutaa jijjiiruun hin milkoofne. Room Management keessatti mirkaneessi.",
            "info"
          );
        } else {
          showMessage(
            "Galmeen milkaa'eera! Keessummaan kutaa " +
            roomNumber + " keessatti galmaa'eera.",
            "success"
          );
        }

        guestForm.reset();
        setDateDefaults();
        await loadAvailableRooms();
      } catch (error) {
        console.error("Guest registration error:", error);
        showMessage(
          "Galmeen hin milkoofne: " +
          (error.message || "Dogoggora hin beekamne") +
          ". Internet, Supabase fi RLS policy mirkaneessi.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register Guest / Galmeessi";
      }
    });

    loadAvailableRooms();
  </script>
</body>
</html>
